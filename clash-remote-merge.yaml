# Clash Verge Merge enhancement for auto-updating personal rule providers.
# These files are generated from source/shadowrocket-custom-rules.list and
# published through the same GitHub repository as shadowrocket.conf.

# Region url-test groups built from node names, so rules do not depend on the
# subscription's group names (whose flag emoji differ, e.g. Taiwan uses the
# Samoa flag). Matches Simplified/Traditional Chinese and English node names.
prepend-proxy-groups:
  - name: TW-Auto
    type: url-test
    include-all-proxies: true
    filter: '(?i)台[灣湾]|taiwan'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: US-Auto
    type: url-test
    include-all-proxies: true
    filter: '(?i)美[國国]|\bUSA?\b|united states'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50

rule-providers:
  personal-shadowrocket-us:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: 🚀 选择节点
    path: ./ruleset/personal-shadowrocket-us.yaml
    url: https://raw.githubusercontent.com/Zijian-Wang/proxy-config/refs/heads/main/clash/rules/shadowrocket-us.yaml
  personal-shadowrocket-tw:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: 🚀 选择节点
    path: ./ruleset/personal-shadowrocket-tw.yaml
    url: https://raw.githubusercontent.com/Zijian-Wang/proxy-config/refs/heads/main/clash/rules/shadowrocket-tw.yaml
  personal-shadowrocket-direct:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: 🚀 选择节点
    path: ./ruleset/personal-shadowrocket-direct.yaml
    url: https://raw.githubusercontent.com/Zijian-Wang/proxy-config/refs/heads/main/clash/rules/shadowrocket-direct.yaml
