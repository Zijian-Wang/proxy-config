  - 'DOMAIN-SUFFIX,tastyworks.com,US-Auto'
  - 'DOMAIN-SUFFIX,tradestation.com,US-Auto'
  - 'DOMAIN-SUFFIX,alpaca.markets,US-Auto'

  # OpenAI/ChatGPT -> US automatic group.
