# Clash Verge Rules enhancement paired with clash-remote-merge.yaml.
# All routing lives in the remote providers (generated from source/*.list), so
# this file only maps each provider to its policy group. US is matched before
# DIRECT so specific US hosts win over broader DIRECT suffixes.

prepend:
  - 'RULE-SET,personal-shadowrocket-us,US-Auto'
  - 'RULE-SET,personal-shadowrocket-jp,JP-Auto'
  - 'RULE-SET,personal-shadowrocket-direct,DIRECT'

append: []
delete: []
