# Clash Verge Rules enhancement paired with clash-remote-merge.yaml.
# Shadowrocket-derived routing is loaded from remote providers. Clash-only
# routing stays inline because it intentionally has no Shadowrocket equivalent.

prepend:
  # Shadowrocket policy -> Clash policy-group mapping.
  - 'RULE-SET,personal-shadowrocket-us,US-Auto'
  - 'RULE-SET,personal-shadowrocket-tw,TW-Auto'
  - 'RULE-SET,personal-shadowrocket-direct,DIRECT'

  # Additional Clash-only broker coverage -> US automatic group.
  - 'DOMAIN-SUFFIX,etrade.com,US-Auto'
  - 'DOMAIN-SUFFIX,etrade.net,US-Auto'
  - 'DOMAIN-SUFFIX,webull.com,US-Auto'
  - 'DOMAIN-SUFFIX,webullbroker.com,US-Auto'
