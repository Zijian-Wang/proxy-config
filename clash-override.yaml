# Clash Verge profile enhancement: rules.
# Add this as a rule enhancement on top of your existing subscription.
#
# Broker/account domains (except Fidelity) use the upstream US url-test group so a very slow but
# technically reachable node does not remain selected by a fallback group.
# OpenAI/ChatGPT always uses the stable US manual group.

